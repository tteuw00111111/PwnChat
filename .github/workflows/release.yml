name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: PwnChat ${{ steps.get_version.outputs.version }}
          body: |
            ## PwnChat ${{ steps.get_version.outputs.version }}

            ### Features
            - End-to-end encrypted messaging with Signal Protocol
            - Cross-platform desktop application (Windows, macOS, Linux)
            - Secure local storage with SQLCipher encryption
            - Real-time messaging with WebSocket communication

            ### Security
            - X3DH key agreement protocol
            - Double Ratchet algorithm for forward secrecy
            - AES-256-GCM message encryption
            - Argon2id password hashing

            ### Downloads
            Choose the appropriate download for your platform:
            - **Windows**: `PwnChat-${{ steps.get_version.outputs.version }}-Windows-x64-Setup.exe`
            - **macOS**: `PwnChat-${{ steps.get_version.outputs.version }}-macOS-x64.dmg` or `PwnChat-${{ steps.get_version.outputs.version }}-macOS-arm64.dmg`
            - **Linux**: `PwnChat-${{ steps.get_version.outputs.version }}-Linux-x64.AppImage`

            ### Installation
            See [Installation Guide](https://github.com/brucewayne/pwnchat-project#installation) for detailed instructions.

            ### Security Notice
            This release has been built and signed using our automated CI/CD pipeline. Verify the checksums below to ensure file integrity.

          draft: false
          prerelease: false

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v1.1

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Build native modules
        run: npm run build:native

      - name: Build application
        run: npm run build

      - name: Package for Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/${{ needs.create-release.outputs.version }}/PwnChat-${{ needs.create-release.outputs.version }}-Windows-x64-Setup.exe
          asset_name: PwnChat-${{ needs.create-release.outputs.version }}-Windows-x64-Setup.exe
          asset_content_type: application/octet-stream

      - name: Upload Windows portable
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/${{ needs.create-release.outputs.version }}/PwnChat-${{ needs.create-release.outputs.version }}-Windows-x64-Portable.exe
          asset_name: PwnChat-${{ needs.create-release.outputs.version }}-Windows-x64-Portable.exe
          asset_content_type: application/octet-stream

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Build native modules
        run: npm run build:native

      - name: Build application
        run: npm run build

      - name: Package for macOS
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS x64 DMG
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/${{ needs.create-release.outputs.version }}/PwnChat-${{ needs.create-release.outputs.version }}-macOS-x64.dmg
          asset_name: PwnChat-${{ needs.create-release.outputs.version }}-macOS-x64.dmg
          asset_content_type: application/octet-stream

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/${{ needs.create-release.outputs.version }}/PwnChat-${{ needs.create-release.outputs.version }}-macOS-arm64.dmg
          asset_name: PwnChat-${{ needs.create-release.outputs.version }}-macOS-arm64.dmg
          asset_content_type: application/octet-stream

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxss1 \
            libgconf-2-4 \
            libxrandr2 \
            libasound2-dev \
            libpangocairo-1.0-0 \
            libatk1.0-dev \
            libcairo-gobject2 \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Build native modules
        run: npm run build:native

      - name: Build application
        run: npm run build

      - name: Package for Linux
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux AppImage
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/${{ needs.create-release.outputs.version }}/PwnChat-${{ needs.create-release.outputs.version }}-Linux-x64.AppImage
          asset_name: PwnChat-${{ needs.create-release.outputs.version }}-Linux-x64.AppImage
          asset_content_type: application/octet-stream

      - name: Upload Linux DEB
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/${{ needs.create-release.outputs.version }}/PwnChat-${{ needs.create-release.outputs.version }}-Linux-x64.deb
          asset_name: PwnChat-${{ needs.create-release.outputs.version }}-Linux-x64.deb
          asset_content_type: application/octet-stream

      - name: Upload Linux RPM
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/${{ needs.create-release.outputs.version }}/PwnChat-${{ needs.create-release.outputs.version }}-Linux-x64.rpm
          asset_name: PwnChat-${{ needs.create-release.outputs.version }}-Linux-x64.rpm
          asset_content_type: application/octet-stream

  generate-checksums:
    needs: [create-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" | \
          while read file; do
            sha256sum "$file" >> checksums.txt
          done

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: artifacts/checksums.txt
          asset_name: checksums.txt
          asset_content_type: text/plain

  publish-release:
    needs: [create-release, build-windows, build-macos, build-linux, generate-checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: "${{ needs.create-release.outputs.release_id }}",
              draft: false
            });