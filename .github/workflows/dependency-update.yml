name: Dependency Updates

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Update frontend dependencies
        run: |
          npx npm-check-updates -u
          npm install

      - name: Update backend dependencies
        run: |
          cd backend
          npx npm-check-updates -u
          npm install

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: automated dependency updates'
          body: |
            ## Automated Dependency Updates

            This PR contains automated dependency updates generated by the dependency update workflow.

            ### Changes
            - Updated npm dependencies to latest versions
            - Frontend and backend dependencies updated

            ### Testing
            Please verify that:
            - [ ] All tests pass
            - [ ] Application builds successfully
            - [ ] No breaking changes in dependencies
            - [ ] Security vulnerabilities are resolved

            ### Notes
            This is an automated PR. Please review changes carefully before merging.
          branch: chore/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
            chore